[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencashflow"
version = "0.1.0"
description = "Open-source cash-flow underwriting toolkit for SME credit risk using open-banking transaction data."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
  { name = "OpenCashFlow contributors" },
]
keywords = [
  "credit-risk",
  "cash-flow",
  "sme",
  "open-banking",
  "underwriting",
  "probability-of-default",
  "tabular-foundation-models",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "joblib>=1.3",
]

[project.optional-dependencies]
trees = [
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "shap>=0.44",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "nbformat>=5.10",
  "nbconvert>=7.0",
  "jupyter>=1.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]
all = [
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "shap>=0.44",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "nbformat>=5.10",
  "nbconvert>=7.0",
  "jupyter>=1.0",
]

[project.urls]
Homepage = "https://github.com/opencashflow/opencashflow"
Documentation = "https://github.com/opencashflow/opencashflow/tree/main/docs"
Issues = "https://github.com/opencashflow/opencashflow/issues"

[project.scripts]
opencashflow = "opencashflow.cli:main"

[tool.setuptools.packages.find]
include = ["opencashflow*"]

[tool.setuptools.package-data]
opencashflow = ["py.typed", "data/*.json", "data/*.yaml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "limix: tests that require the LimiX-2-1016 checkpoint and the limix package",
  "slow: tests that take more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "data/raw"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",   # line length is handled by the formatter
  "B905",   # zip strict is not available on Python 3.9, kept for 3.10+
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
"docs/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
files = ["opencashflow"]

[tool.coverage.run]
source = ["opencashflow"]
omit = ["opencashflow/data/synthetic.py"]

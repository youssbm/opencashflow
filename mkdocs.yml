site_name: OpenCashFlow
site_description: Cash-flow underwriting for SME credit risk
repo_url: https://github.com/youssbm/opencashflow
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Methodology: methodology.md
  - Quickstart: examples/quickstart.md
  - Feature dictionary: features.md
  - Datasets: datasets.md
  - LimiX-2: limix.md
  - Architecture: architecture.md
  - Transactions: examples/transactions.md
